<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Televideo</title>
    <style>
        /* ========================================================
           CONTROLLI GLOBALI
           ======================================================== */
        :root {
            --scala: 1.3;          /* Dimensione generale aumentata del 30% */
            --colonne: 3;          /* Default iniziale a 3 colonne */
            --opacita-riposo: 0.1; /* Quasi totalmente invisibile a riposo */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }
        .tv-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }
        .televideo-img {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0); 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;                 
            -ms-interpolation-mode: nearest-neighbor; 
        }

        /* GRIGLIA TASTIERINO FISSA */
        .numpad-container {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 15, 15, 0.95);
            border: calc(2px * var(--scala)) solid #ffffff;
            padding: calc(8px * var(--scala));
            border-radius: calc(8px * var(--scala));
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(var(--colonne), calc(45px * var(--scala))); 
            grid-gap: calc(6px * var(--scala));
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            opacity: var(--opacita-riposo);
            transition: opacity 0.25s ease-in-out, grid-template-columns 0.15s ease;
        }
        
        .numpad-container:hover {
            opacity: 1;
        }

        /* DISPLAY INTERNO */
        .numpad-display-wrapper {
            grid-column: span var(--colonne);
            display: flex;
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: calc(4px * var(--scala));
            height: calc(35px * var(--scala));
            align-items: center;
            justify-content: center;
            padding: 0 calc(6px * var(--scala));
        }

        .numpad-display {
            color: #ff0000;
            font-size: calc(18px * var(--scala));
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
        }

        /* BOTTONI NUMERICI */
        .numpad-btn {
            height: calc(40px * var(--scala));
            background: #222222;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: calc(18px * var(--scala));
            font-weight: bold;
            font-family: monospace;
            border-radius: calc(4px * var(--scala));
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .numpad-btn:hover {
            background: #ff0000;
            border-color: #ffffff;
        }

        .btn-toggle-layout {
            background: #222222;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: calc(14px * var(--scala));
        }
        .btn-toggle-layout:hover {
            background: #222222;
            color: #ffff00;
            border-color: #ffffff;
        }

        .btn-clr { background: #880000; border-color: #ff0000; }

        /* NAVIGAZIONE TOUCH COMPATIBILE */
        .touch-arrows-row {
            grid-column: span var(--colonne);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: calc(4px * var(--scala));
            margin-top: calc(4px * var(--scala));
        }
        .btn-nav-touch {
            height: calc(35px * var(--scala));
            background: #333333;
            border-color: #666666;
            font-size: calc(14px * var(--scala));
        }
    </style>
</head>
<body>

    <div class="tv-wrapper">
        <div id="numpad" class="numpad-container">
            <div class="numpad-display-wrapper">
                <div id="num-display" class="numpad-display">P100</div>
            </div>
            
            <div class="numpad-btn" onclick="pressNum('1')">1</div>
            <div class="numpad-btn" onclick="pressNum('2')">2</div>
            <div class="numpad-btn" onclick="pressNum('3')">3</div>
            <div class="numpad-btn" onclick="pressNum('4')">4</div>
            <div class="numpad-btn" onclick="pressNum('5')">5</div>
            <div class="numpad-btn" onclick="pressNum('6')">6</div>
            <div class="numpad-btn" onclick="pressNum('7')">7</div>
            <div class="numpad-btn" onclick="pressNum('8')">8</div>
            <div class="numpad-btn" onclick="pressNum('9')">9</div>
            

            <div class="numpad-btn btn-toggle-layout" onclick="toggleLayout()">⚙️</div>	    
	    <div class="numpad-btn" onclick="pressNum('0')">0</div>
            <div class="numpad-btn btn-clr" onclick="pressClear()">C</div>

            <div id="touch-navigation" class="touch-arrows-row"></div>
        </div>

        <img id="televideo" class="televideo-img" src="" alt="Sintonizzazione...">
    </div>

<script>
    let currentPage = 100;
    let currentSubpage = 1;
    let typedBuffer = "";
    let refreshInterval;

    let previousPage = 100;
    let previousSubpage = 1;

    const imgElement = document.getElementById('televideo');
    const numDisplay = document.getElementById('num-display');
    const numpadContainer = document.getElementById('numpad');

    function toggleLayout() {
        const root = document.documentElement;
        const currentCols = getComputedStyle(root).getPropertyValue('--colonne').trim();
        root.style.setProperty('--colonne', currentCols === '3' ? '2' : '3');
	root.style.setProperty('--scala', currentCols === '3' ? '1.1' : '1.3');

    }

    function checkTouchSupport() {
        const isLgTV = /WebOS|SmartTV|LG/i.test(navigator.userAgent);
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        
        if (isTouch && !isLgTV) {
            document.getElementById('touch-navigation').innerHTML = `
                <button class="numpad-btn btn-nav-touch" onclick="updatePage(currentPage - 1, 1)">▼</button>
                <button class="numpad-btn btn-nav-touch" onclick="updatePage(currentPage + 1, 1)">▲</button>
                <button class="numpad-btn btn-nav-touch" onclick="if(currentSubpage > 1) updatePage(currentPage, currentSubpage - 1)">◀</button>
                <button class="numpad-btn btn-nav-touch" onclick="updatePage(currentPage, currentSubpage + 1)">▶</button>
            `;
        }
    }

    imgElement.onerror = function() {
        if (currentSubpage > 1) {
            currentSubpage = 1;
            updatePage(currentPage, 1, false, true); 
        } else {
            currentPage = previousPage;
            currentSubpage = previousSubpage;
            updatePage(currentPage, currentSubpage, false, true);
        }
    };

    function pressNum(num) {
        if (typedBuffer.length >= 3) typedBuffer = ""; 
        typedBuffer += num;
        numDisplay.innerText = "P" + typedBuffer;

        if (typedBuffer.length === 3) {
            updatePage(typedBuffer, 1);
            typedBuffer = "";
        }
    }

    function pressClear() {
        typedBuffer = "";
        numDisplay.innerText = "P" + currentPage;
    }

    function updatePage(page, sub = 1, isAutoRefresh = false, isErrorFallback = false) {
        if (!isErrorFallback && !isAutoRefresh) {
            previousPage = currentPage;
            previousSubpage = currentSubpage;
        }

        currentPage = parseInt(page);
        currentSubpage = parseInt(sub);
        
        if (!isAutoRefresh && !isErrorFallback && sub === 1) {
            currentSubpage = 1;
        }

        let subText = (currentSubpage !== 1) ? ("." + currentSubpage) : "";
        numDisplay.innerText = "P" + currentPage + subText;

        const cacheBuster = isAutoRefresh ? `?t=${new Date().getTime()}` : '';
        let subString = (currentSubpage !== 1) ? ("." + currentSubpage) : "";
        
        imgElement.src = `https://www.televideo.rai.it/televideo/pub/tt4web/Nazionale/16_9_page-${currentPage}${subString}.png${cacheBuster}`;
        
        avviaAutoRefresh();
    }

    function avviaAutoRefresh() {
        clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            updatePage(currentPage, currentSubpage, true);
        }, 30000);
    }

    updatePage(currentPage, 1);
    checkTouchSupport();

    document.addEventListener('keydown', function(event) {
        const keysToBlock = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        if (keysToBlock.includes(event.key)) event.preventDefault(); 

        switch(event.key) {
            case 'ArrowUp': updatePage(currentPage + 1, 1); break;
            case 'ArrowDown': if(currentPage > 100) updatePage(currentPage - 1, 1); break;
            case 'ArrowRight': updatePage(currentPage, currentSubpage + 1); break; 
            case 'ArrowLeft': if(currentSubpage > 1) updatePage(currentPage, currentSubpage - 1); break;
        }
    });

</script>
</body>
</html>
